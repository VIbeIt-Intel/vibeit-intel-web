<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeIt-Intel</title>
    <meta
      name="description"
      content="Websites and digital systems for small and medium businesses."
    />
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="prefetch" href="services.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=it-gone" />
  </head>
  <body class="splash">
    <main class="page">
      <picture class="hero">
        <source
          media="(orientation: portrait)"
          type="image/webp"
          srcset="assets/hero-no-it-portrait.webp?v=it-gone"
        />
        <source type="image/webp" srcset="assets/hero-no-it.webp?v=it-gone" />
        <source
          media="(orientation: portrait)"
          srcset="assets/hero-no-it-portrait.png?v=it-gone"
        />
        <img
          class="hero-image"
          src="assets/hero-no-it.png?v=it-gone"
          alt="Vibe INTEL"
          fetchpriority="high"
        />
      </picture>

      <a class="it-link" href="services.html" aria-label="Open VibeIt-Intel packages">
        <span class="it-plate">
          <span class="it-back" aria-hidden="true"></span>
          <img
            class="it-face"
            src="assets/it-button.png?v=it-gone"
            alt="It"
            width="1024"
            height="1024"
          />
        </span>
      </a>

      <div class="overlay">
        <p class="note">Websites and systems for growing businesses.</p>
      </div>
    </main>
    <div class="it-portal" aria-hidden="true"></div>
    <script src="it-hotspot.js?v=it-gone"></script>
  </body>
</html>
