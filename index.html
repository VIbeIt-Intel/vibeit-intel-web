<!DOCTYPE html>

  <body class="splash">

        />

          class="hero-image"

        />

          class="it-face"
          src="assets/it-button.png?v=it-keep-face"

          width="1024"
          height="1024"
        />

      <div class="overlay">
        <p class="note">Websites and systems for growing businesses.</p>

    <div class="it-portal" aria-hidden="true"></div>
