<!DOCTYPE html>
<html lang="en">
  <head>

    <link rel="preload" as="image" href="assets/splash-poster.jpg?v=poster1" fetchpriority="high" media="(orientation: landscape) and (min-aspect-ratio: 4/5)" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "VibeIt-Intel",
        "url": "https://vibeit-intel.net/",
        "sameAs": ["https://www.facebook.com/VibeItIntel/"]
      }
    </script>
    <meta property="og:title" content="VibeIt-Intel" />
    <meta
      property="og:description"
      content="Websites and systems for South African SMEs."
    />
    <meta property="og:url" content="https://vibeit-intel.net/" />
    <meta property="og:type" content="website" />

      property="og:image"
      content="https://vibeit-intel.net/assets/og-image.jpg?v=og2"
    />

      content="VibeIt 3D mark — purple-to-orange V and It tile"
    />

    <link rel="icon" href="https://vibeit-intel.net/favicon.ico?v=vmark1" sizes="any" />
    <link
      rel="icon"
      href="https://vibeit-intel.net/assets/favicon-48.png?v=vmark1"
      type="image/png"
      sizes="48x48"
    />
    <link
      rel="icon"
      href="https://vibeit-intel.net/assets/favicon-192.png?v=vmark1"
      type="image/png"
      sizes="192x192"
    />
    <link
      rel="apple-touch-icon"
      href="https://vibeit-intel.net/assets/apple-touch-icon.png?v=vmark1"
      sizes="180x180"
    />
    <link rel="stylesheet" href="styles.css?v=splash-fast1" />
  </head>
  <body class="splash is-intro-wait">
    <main class="page">
      <picture class="hero">
        <source
          media="(orientation: portrait), (max-aspect-ratio: 4/5)"
          type="image/webp"
          srcset="assets/hero-no-it-portrait.webp?v=splash-back"
        />
        <source
          media="(orientation: portrait), (max-aspect-ratio: 4/5)"
          srcset="assets/hero-no-it-portrait.png?v=splash-back"
        />
        <img
          class="hero-image"
          alt="VibeIt-Intel"
          width="1536"
          height="1024"
        />
      </picture>
      <picture class="intro-poster">
        <source
          media="(orientation: landscape) and (min-aspect-ratio: 4/5)"
          srcset="assets/splash-poster.jpg?v=poster1"
        />
        <img alt="" fetchpriority="high" decoding="async" />
      </picture>
      <video
        class="hero-video hero-video--desk"
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        fetchpriority="high"
        disablepictureinpicture
        aria-hidden="true"
      >
        <source
          media="(orientation: landscape) and (min-aspect-ratio: 4/5)"
          src="assets/splash.mp4"
          type="video/mp4"
        />
      </video>
      <script>
        (function () {
          var clip = document.querySelector(".hero-video--desk");
          if (!clip) return;
          if (
            window.matchMedia(
              "(orientation: portrait), (max-aspect-ratio: 4/5), (prefers-reduced-motion: reduce)"
            ).matches
          ) {
            return;
          }
          clip.muted = true;
          clip.defaultMuted = true;
          clip.playsInline = true;
          var play = clip.play();
          if (play && play.catch) play.catch(function () {});
        })();
      </script>

      <a class="it-link" href="/services/" aria-label="Open VibeIt-Intel packages">
        <picture>
          <source type="image/webp" data-srcset="assets/it-button.webp?v=it-soon1" />
          <img
            class="it-face"
            data-src="assets/it-button.png?v=it-soon1"
            alt="It"
            width="640"
            height="640"
          />
        </picture>
      </a>

      <h1 class="sr-only">VibeIt-Intel</h1>
      <p class="sr-only">
        VibeIt-Intel builds websites and digital systems for South African SMEs.
      </p>

      <div class="overlay">
        <p class="note">VibeIt-Intel. Websites and systems for growing businesses.</p>
      </div>
    </main>
    <div class="it-portal" aria-hidden="true"></div>
    <script src="it-hotspot.js?v=splash-fast1"></script>
  </body>
</html>
