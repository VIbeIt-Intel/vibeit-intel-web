<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe It INTEL — Under Construction</title>
    <meta
      name="description"
      content="Vibe It INTEL is under construction. Please check back soon."
    />
    <link rel="icon" href="assets/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="splash">
    <main class="page">
      <picture class="hero">
        <source
          media="(orientation: portrait)"
          srcset="assets/logo-hero-portrait.png"
        />
        <img
          class="hero-image"
          src="assets/logo-hero.png"
          alt="Vibe It INTEL"
        />
      </picture>

      <a class="it-link" href="services.html" aria-label="Open Vibe It INTEL services">
        <span class="it-pulse" aria-hidden="true"></span>
        <span class="it-pulse it-pulse-delay" aria-hidden="true"></span>
      </a>

      <div class="overlay">
        <p class="status">
          <span class="status-dot" aria-hidden="true"></span>
          Under Construction
        </p>
        <p class="note">We're building something new. Please check back soon.</p>
      </div>
    </main>
  </body>
</html>
