    <script>
      (function () {
        var path = location.pathname || "";
        var special = {
          "/contact.html": "/services/#contact",
          "/entry-sent.html": "/brief-sent/",
        };
        if (special[path]) {
          location.replace(special[path]);
          return;
        }
        if (/\.html$/.test(path) && path !== "/404.html") {
          location.replace(path.replace(/\.html$/, "/") + location.search + location.hash);
        }
      })();
    </script>
